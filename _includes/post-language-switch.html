<nav class="post-language-switch" aria-label="Language / Język">
{%- if page.pl_page -%}
  <a href="{{ site.baseurl }}{{ page.en_url }}" lang="en" hreflang="en" data-post-title="{{ page.title-en | escape }}">English</a>
  <a href="#polski" lang="pl" hreflang="pl" data-post-title="{{ page.title | escape }}">Polski</a>
{%- else -%}
  <a href="#english" lang="en" hreflang="en" data-post-title="{{ page.title | escape }}">English</a>
  <a href="{{ site.baseurl }}{{ page.pl_url | default: '#polski' }}" lang="pl" hreflang="pl" data-post-title="{{ page.title-pl | escape }}">Polski</a>
{%- endif -%}
</nav>
