<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-labelledby="preview-test-title">
  <title id="preview-test-title">A pull request gets a preview, and only then is it merged</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1b1b1b">
    <rect x="10" y="40" width="170" height="70" rx="8" fill="#eef3f8" stroke="#37474f" stroke-width="2"/>
    <text x="95" y="82">Pull request</text>
    <rect x="235" y="40" width="170" height="70" rx="8" fill="#d9f2e0" stroke="#2e7d32" stroke-width="2"/>
    <text x="320" y="82">Preview</text>
    <rect x="460" y="40" width="170" height="70" rx="8" fill="#eef3f8" stroke="#37474f" stroke-width="2"/>
    <text x="545" y="82">Merge</text>
  </g>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="182" y1="75" x2="232" y2="75"/>
    <line x1="407" y1="75" x2="457" y2="75"/>
  </g>
</svg>
