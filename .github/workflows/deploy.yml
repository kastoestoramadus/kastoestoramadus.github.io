name: Build & deploy blog

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  # never cancel a running publish of master, only superseded PR builds
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Required status check of the "Protect master" ruleset: keep the job name `build` and the pull_request trigger.
  # Runs all the code of the PR with a read-only token; the publishing jobs below only copy its output.
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Generate missing tag and category pages
        run: |
          ./scripts/generate-categories
          ./scripts/generate-tags

      - name: Build
        run: bundle exec jekyll build

      - name: Check links and HTML
        run: bundle exec htmlproofer ./_site --disable-external --ignore-missing-alt --ignore-empty-alt --no-enforce-https

      # the script that publishes with a write token after the merge: better to find out here that it is broken
      - name: Test the publish script
        run: ./scripts/test-publish-pages

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # The same site for https://blog.ww86.eu/preview/pr-<N>/: another baseurl, and JEKYLL_ENV=preview keeps
      # Disqus, Google Analytics and force-https out and adds noindex (they are all gated on "production").
      - name: Build preview
        if: github.event_name == 'pull_request'
        env:
          JEKYLL_ENV: preview
          BASEURL: /preview/pr-${{ github.event.pull_request.number }}
        run: bundle exec jekyll build --baseurl "$BASEURL" --destination _preview

      - name: Check preview
        if: github.event_name == 'pull_request'
        env:
          BASEURL: /preview/pr-${{ github.event.pull_request.number }}
        run: |
          ./scripts/check-preview _preview "$BASEURL"
          # the Disqus anchor does not exist in previews, there are no comments there
          bundle exec htmlproofer ./_preview --swap-urls "^$BASEURL:" --ignore-urls '/#disqus_thread$/' --disable-external --ignore-missing-alt --ignore-empty-alt --no-enforce-https

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: _preview
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Every commit that lands on master is published to https://blog.ww86.eu: the built site goes to the root of the
  # gh-pages branch, which GitHub Pages serves. No secrets, GITHUB_TOKEN only; contents: write on this job only.
  # Own concurrency groups, one per target: a group holds one running and one *pending* job and a newer pending job
  # cancels the older one, so a shared group would let a preview publish cancel a queued master publish. Races between
  # groups (master vs. a preview) are handled by the rebase-and-retry in the script.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: src/scripts/publish-pages pages site site

  # Every pull request from this repository gets https://blog.ww86.eu/preview/pr-<N>/ (removed again when it is closed,
  # see preview-cleanup.yml). Not for forks and Dependabot: their GITHUB_TOKEN is read-only, so publishing would fail.
  # There is deliberately no pull_request_target: it would run untrusted code with a write token.
  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # shared with preview-cleanup.yml, so closing the PR never interleaves with a publish of it
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: https://blog.ww86.eu/preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v8
        with:
          name: preview
          path: preview
      - name: Publish to gh-pages
        env:
          PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          src/scripts/publish-pages pages preview "$PR" preview
          echo "Preview: https://blog.ww86.eu/preview/pr-$PR/ (live about a minute after this job, when GitHub Pages has built it)" >> "$GITHUB_STEP_SUMMARY"
