<svg xmlns="http://www.w3.org/2000/svg" width="600" height="274" viewBox="0 0 600 274" role="img" aria-labelledby="t d"><title id="t">Paliczkowe stany 0-3 jednego palca</title><rect width="600" height="274" fill="#ffffff"/><text x="300.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1c2733" font-weight="bold">Cztery stany jednego palca (system czwórkowy)</text><rect x="51.0" y="130.0" width="18.0" height="20.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="40" y="150" width="60" height="8" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1"/><text x="70.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">0</text><text x="70.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">0</text><text x="70.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">schowany</text><rect x="196.0" y="114.0" width="18.0" height="36.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="185" y="150" width="60" height="8" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1"/><text x="215.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1</text><text x="215.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">1</text><text x="215.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">zgięcie między 1. a 2. paliczkiem</text><rect x="341.0" y="97.0" width="18.0" height="53.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="330" y="150" width="60" height="8" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1"/><text x="360.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">2</text><text x="360.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">2</text><text x="360.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">zgięcie między 2. a 3. paliczkiem</text><rect x="486.0" y="80.0" width="18.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="475" y="150" width="60" height="8" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1"/><text x="505.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">3</text><text x="505.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">3</text><text x="505.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6b7b">wysunięty w całości</text><text x="300.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">Każdy palec = jedna cyfra 0–3. Dziesięć palców = 4^10 = 1 048 576 stanów (0 … 1 048 575).</text></svg>