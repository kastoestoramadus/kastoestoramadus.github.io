<svg xmlns="http://www.w3.org/2000/svg" width="560" height="268" viewBox="0 0 560 268" role="img" aria-labelledby="t d"><title id="t">Dziesięć palców z wartościami 1, 2, 4, 8, 16, 32, 64, 128, 256, 512</title><rect width="560" height="268" fill="#ffffff"/><text x="280.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2733" font-weight="bold">Wartości palców w systemie dwójkowym</text><text x="280.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6b7b">start od wskazującego prawej ręki: 1, 2, 4, 8, 16, 32, …, 512</text><g transform="translate(70.0,60.0)"><rect x="78.0" y="52.0" width="16.0" height="13" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="16.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="36.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="56.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="76.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="6" y="76.0" width="88" height="42" rx="12" fill="#eef3f8" stroke="#1c2733" stroke-width="1.4"/><rect x="32" y="118.0" width="36" height="12" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1.2"/><text x="22.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">8</text><text x="42.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">4</text><text x="62.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">2</text><text x="82.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1</text><text x="50.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1c2733" font-weight="bold">prawa ręka (…do 16)</text></g><g transform="translate(330.0,60.0)"><rect x="-16.0" y="52.0" width="16.0" height="13" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="16.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="36.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="56.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="76.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="6" y="76.0" width="88" height="42" rx="12" fill="#eef3f8" stroke="#1c2733" stroke-width="1.4"/><rect x="32" y="118.0" width="36" height="12" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1.2"/><text x="22.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">256</text><text x="42.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">128</text><text x="62.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">64</text><text x="82.5" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">32</text><text x="50.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1c2733" font-weight="bold">lewa ręka (…do 512)</text></g><text x="280.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">Pojedynczo wystawiony n-ty palec to 2^(n−1). Suma wystawionych = liczba.</text></svg>