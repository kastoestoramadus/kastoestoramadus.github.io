<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="t d"><title id="t">Jeden palec jako bit</title><rect width="600" height="220" fill="#ffffff"/><text x="300.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1c2733" font-weight="bold">Etap 0: jeden palec, dwa stany</text><rect x="110.0" y="60.0" width="20.0" height="80.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><text x="120.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1</text><rect x="290.0" y="116.0" width="20.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><text x="300.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">0</text><text x="480.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1c2733" font-weight="bold">1 bit</text><text x="300.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">Zanim doliczymy się miliarda, trzeba policzyć do jeden. Każdy palec to przełącznik.</text></svg>