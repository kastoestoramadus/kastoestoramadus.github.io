<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="t d"><title id="t">Dłonie pokazujące 17 w systemie szóstkowym</title><rect width="560" height="250" fill="#ffffff"/><text x="280.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1c2733" font-weight="bold">System szóstkowy na dwóch rękach: 2·6 + 5 = 17</text><g transform="translate(60.0,44.0)"><rect x="78.0" y="52.0" width="30.0" height="13" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="16.0" y="0.0" width="13.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="36.0" y="0.0" width="13.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="56.0" y="0.0" width="13.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="76.0" y="0.0" width="13.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="6" y="76.0" width="88" height="42" rx="12" fill="#eef3f8" stroke="#1c2733" stroke-width="1.4"/><rect x="32" y="118.0" width="36" height="12" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1.2"/><text x="50.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1c2733" font-weight="bold">Y = 5  (×1, jedności)</text></g><g transform="translate(330.0,44.0)"><rect x="-30.0" y="52.0" width="30.0" height="13" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="16.0" y="0.0" width="13.0" height="70.0" rx="6" fill="#dcebf7" stroke="#1c2733" stroke-width="1.4"/><rect x="36.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="56.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="76.0" y="46.0" width="13.0" height="24.0" rx="6" fill="#9db0c0" stroke="#1c2733" stroke-width="1.4"/><rect x="6" y="76.0" width="88" height="42" rx="12" fill="#eef3f8" stroke="#1c2733" stroke-width="1.4"/><rect x="32" y="118.0" width="36" height="12" rx="4" fill="#eef3f8" stroke="#1c2733" stroke-width="1.2"/><text x="50.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1c2733" font-weight="bold">X = 2  (×6, szóstki)</text></g><text x="280.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">Prawa ręka liczy jedności 0–5, lewa zapisuje pełne szóstki. Wzór: X·6 + Y.</text></svg>