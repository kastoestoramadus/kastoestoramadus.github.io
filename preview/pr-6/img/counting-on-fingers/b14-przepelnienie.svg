<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="t d"><title id="t">Przepełnienie licznika przy 36, 1024 i 1 048 576</title><rect width="600" height="260" fill="#ffffff"/><text x="300.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1c2733" font-weight="bold">Przepełnienie — licznik wraca do zera</text><text x="120.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">11111 11111</text><text x="120.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6b7b">= 1023 (wszystko wystawione)</text><text x="300.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#1c2733" font-weight="bold">+ 1</text><text x="480.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">00000 00000</text><text x="480.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6b7b">= 0; pełne 1024 nosisz w głowie</text><path d="M 190 96 C 240 60, 360 60, 420 96" fill="none" stroke="#1c2733" stroke-width="1.6" marker-end="url(#arr)"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#1c2733"/></marker></defs><text x="300.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">36: szóstkowy: 5·6+5 = 35, potem 0</text><text x="300.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">1024: dwójkowy: 2^10</text><text x="300.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7b">1 048 576: czwórkowy: 4^10</text></svg>