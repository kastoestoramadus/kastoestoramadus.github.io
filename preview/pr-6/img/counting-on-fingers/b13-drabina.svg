<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264" role="img" aria-labelledby="t d"><title id="t">Pojemność systemów liczenia na palcach</title><rect width="640" height="264" fill="#ffffff"/><text x="320.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2733" font-weight="bold">Drabina pojemności (skala logarytmiczna)</text><rect x="150" y="44" width="182" height="24" rx="5" fill="#dcebf7" stroke="#1c2733" stroke-width="1.1"/><text x="339.6" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">10</text><text x="144.0" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1c2733">liczenie do 10 (suma palców)</text><text x="158.0" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1c2733">11 stanów</text><rect x="150" y="86" width="199" height="24" rx="5" fill="#dcebf7" stroke="#1c2733" stroke-width="1.1"/><text x="356.7" y="103.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">35</text><text x="144.0" y="103.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1c2733">system szóstkowy (2 ręce)</text><text x="158.0" y="103.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1c2733">36 stanów</text><rect x="150" y="128" width="245" height="24" rx="5" fill="#dcebf7" stroke="#1c2733" stroke-width="1.1"/><text x="403.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">1 023</text><text x="144.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1c2733">system dwójkowy (10 palców)</text><text x="158.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1c2733">1024 stanów</text><rect x="150" y="170" width="340" height="24" rx="5" fill="#dcebf7" stroke="#1c2733" stroke-width="1.1"/><text x="498.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">≈ 1,1×10¹²</text><text x="144.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1c2733">system czwórkowy (10 palców)</text><text x="158.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1c2733">1 048 576 stanów</text><rect x="150" y="212" width="530" height="24" rx="5" fill="#2b6cb0" stroke="#1c2733" stroke-width="1.1"/><text x="688.0" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">≈ 1,1×10¹²</text><text x="144.0" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1c2733">czwórkowy, dłonie + stopy</text><text x="158.0" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#ffffff">4^20 ≈ 1,1×10¹² stanów</text></svg>