<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Schemat: IPv4 za NAT wobec IPv6 z zapora na ruterze">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Publiczny IPv4 za NAT a publiczny IPv6 z zaporą</text>
  <!-- LEFT: IPv4+NAT -->
  <text x="240" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0392b">IPv4: jeden publiczny adres, reszta ukryta za NAT</text>
  <ellipse cx="240" cy="110" rx="80" ry="30" fill="#f2f2f2" stroke="#999999"/>
  <text x="240" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Internet</text>
  <!-- scanner -->
  <rect x="60" y="96" width="90" height="28" fill="#fbe9e7" stroke="#c0392b"/>
  <text x="105" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c0392b">skaner botów</text>
  <line x1="150" y1="110" x2="158" y2="110" stroke="#c0392b" stroke-width="1.5"/>
  <text x="105" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c0392b">pula IPv4 = do przejrzenia</text>
  <!-- router with NAT -->
  <rect x="200" y="170" width="80" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">ruter + NAT</text>
  <text x="240" y="203" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666666">203.0.113.7</text>
  <line x1="240" y1="140" x2="240" y2="170" stroke="#666666" stroke-width="1.5"/>
  <!-- devices -->
  <g font-family="sans-serif" font-size="10" fill="#333333" text-anchor="middle">
    <rect x="130" y="260" width="70" height="36" rx="5" fill="#f7f7f7" stroke="#888888"/>
    <text x="165" y="278">laptop</text><text x="165" y="290" fill="#888888">192.0.2.10</text>
    <rect x="215" y="260" width="70" height="36" rx="5" fill="#f7f7f7" stroke="#888888"/>
    <text x="250" y="278">NAS</text><text x="250" y="290" fill="#888888">192.0.2.20</text>
    <rect x="300" y="260" width="70" height="36" rx="5" fill="#f7f7f7" stroke="#888888"/>
    <text x="335" y="278">telefon</text><text x="335" y="290" fill="#888888">192.0.2.30</text>
  </g>
  <line x1="165" y1="260" x2="225" y2="214" stroke="#999999" stroke-width="1.2"/>
  <line x1="250" y1="260" x2="240" y2="214" stroke="#999999" stroke-width="1.2"/>
  <line x1="335" y1="260" x2="255" y2="214" stroke="#999999" stroke-width="1.2"/>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444444">adresy prywatne: niewidoczne z zewnątrz,</text>
  <text x="240" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444444">każda usługa od zewnątrz = ręczny port-forward</text>
  <text x="240" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c0392b">cała pula IPv4 jest skanowalna, adres po adresie</text>
  <!-- RIGHT: IPv6 + firewall -->
  <text x="720" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f6f43">IPv6: każde urządzenie ma własny adres publiczny</text>
  <ellipse cx="720" cy="110" rx="80" ry="30" fill="#f2f2f2" stroke="#999999"/>
  <text x="720" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Internet</text>
  <!-- router with firewall -->
  <rect x="640" y="170" width="160" height="44" rx="6" fill="#ffffff" stroke="#1f6f43" stroke-width="2"/>
  <text x="720" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">ruter + zapora (domyślnie odrzuca)</text>
  <text x="720" y="203" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666666">2001:db8:1:2::/64</text>
  <line x1="720" y1="140" x2="720" y2="170" stroke="#666666" stroke-width="1.5"/>
  <!-- blocked arrow -->
  <text x="742" y="150" font-family="sans-serif" font-size="10" fill="#1f6f43">ruch niezainicjowany: STOP</text>
  <!-- devices each public -->
  <g font-family="sans-serif" font-size="10" fill="#333333" text-anchor="middle">
    <rect x="610" y="260" width="96" height="36" rx="5" fill="#eef7f1" stroke="#1f6f43"/>
    <text x="658" y="278">laptop</text><text x="658" y="290" fill="#1f6f43">2001:db8:1:2::a</text>
    <rect x="716" y="260" width="96" height="36" rx="5" fill="#eef7f1" stroke="#1f6f43"/>
    <text x="764" y="278">NAS</text><text x="764" y="290" fill="#1f6f43">2001:db8:1:2::b</text>
    <rect x="822" y="260" width="96" height="36" rx="5" fill="#eef7f1" stroke="#1f6f43"/>
    <text x="870" y="278">telefon</text><text x="870" y="290" fill="#1f6f43">2001:db8:1:2::c</text>
  </g>
  <line x1="658" y1="260" x2="700" y2="214" stroke="#1f6f43" stroke-width="1.2"/>
  <line x1="764" y1="260" x2="730" y2="214" stroke="#1f6f43" stroke-width="1.2"/>
  <line x1="870" y1="260" x2="770" y2="214" stroke="#1f6f43" stroke-width="1.2"/>
  <text x="720" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444444">bez port-forwardingu i bez NAT; dostęp od zewnątrz</text>
  <text x="720" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444444">otwierasz świadomie, regułą zapory</text>
  <text x="720" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f6f43">ślepe skanowanie /64 (2^64 adresów) — niewykonalne…</text>
  <text x="720" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c0392b">…ale to nie jest firewall: bez filtra wszystko wystaje (RFC 6092)</text>
  <text x="480" y="415" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888888">Adresy przykładowe z puli dokumentacyjnych: 203.0.113.0/24 (RFC 5737), 2001:db8::/32 (RFC 3849). Zalecenie filtrowania: RFC 6092. Schemat: własny.</text>
</svg>
