<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Publiczny IPv4 za NAT a publiczny IPv6 za zaporą routera</text>

  <!-- Panel A: IPv4 + NAT -->
  <rect x="20" y="50" width="460" height="470" rx="10" fill="#f7f7f7" stroke="#cccccc"/>
  <text x="250" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">IPv4: jeden adres publiczny, NAT w routerze</text>
  <ellipse cx="250" cy="118" rx="70" ry="26" fill="#e8eef7" stroke="#7a96b8"/>
  <text x="250" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">Internet</text>
  <line x1="250" y1="144" x2="250" y2="200" stroke="#555" stroke-width="2"/>
  <polygon points="250,208 244,196 256,196" fill="#555"/>
  <rect x="150" y="208" width="200" height="58" rx="8" fill="#fff3e0" stroke="#c98a4b"/>
  <text x="250" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Router: NAT</text>
  <text x="250" y="250" text-anchor="middle" font-size="11.5" fill="#555">adres publiczny: 203.0.113.7</text>
  <line x1="250" y1="266" x2="250" y2="330" stroke="#555" stroke-width="2"/>
  <g font-size="12" fill="#1a1a1a">
    <rect x="60" y="330" width="110" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="115" y="349" text-anchor="middle">Laptop</text><text x="115" y="366" text-anchor="middle" font-size="10.5" fill="#666">192.0.2.10</text>
    <rect x="195" y="330" width="110" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="250" y="349" text-anchor="middle">Telefon</text><text x="250" y="366" text-anchor="middle" font-size="10.5" fill="#666">192.0.2.11</text>
    <rect x="330" y="330" width="110" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="385" y="349" text-anchor="middle">NAS</text><text x="385" y="366" text-anchor="middle" font-size="10.5" fill="#666">192.0.2.20</text>
  </g>
  <text x="250" y="415" text-anchor="middle" font-size="12" fill="#a33">Ruch przychodzący bez przekierowania portów: zatrzymany</text>
  <text x="250" y="434" text-anchor="middle" font-size="12" fill="#555">Urządzenia niewidoczne z zewnątrz „przy okazji” NAT-u,</text>
  <text x="250" y="451" text-anchor="middle" font-size="12" fill="#555">a cała przestrzeń adresowa IPv4 jest trywialna do przeskanowania.</text>
  <text x="250" y="475" text-anchor="middle" font-size="11.5" fill="#888">(adresy przykładowe: RFC 5737/3849)</text>

  <!-- Panel B: IPv6 + firewall -->
  <rect x="520" y="50" width="460" height="470" rx="10" fill="#f7f7f7" stroke="#cccccc"/>
  <text x="750" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">IPv6: każdy host ma adres publiczny, decyduje zapora</text>
  <ellipse cx="750" cy="118" rx="70" ry="26" fill="#e8eef7" stroke="#7a96b8"/>
  <text x="750" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">Internet</text>
  <line x1="750" y1="144" x2="750" y2="200" stroke="#555" stroke-width="2"/>
  <polygon points="750,208 744,196 756,196" fill="#555"/>
  <rect x="640" y="208" width="220" height="58" rx="8" fill="#e8f5e9" stroke="#4b9b63"/>
  <text x="750" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Router: zapora stanowa</text>
  <text x="750" y="250" text-anchor="middle" font-size="11.5" fill="#555">domyślnie blokuje niewywołany ruch (RFC 6092)</text>
  <line x1="750" y1="266" x2="750" y2="330" stroke="#555" stroke-width="2"/>
  <g font-size="12" fill="#1a1a1a">
    <rect x="560" y="330" width="118" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="619" y="349" text-anchor="middle">Laptop</text><text x="619" y="366" text-anchor="middle" font-size="10.5" fill="#666">2001:db8:1:2::10</text>
    <rect x="695" y="330" width="110" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="750" y="349" text-anchor="middle">Telefon</text><text x="750" y="366" text-anchor="middle" font-size="10.5" fill="#666">2001:db8:1:2::11</text>
    <rect x="830" y="330" width="110" height="46" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="885" y="349" text-anchor="middle">NAS</text><text x="885" y="366" text-anchor="middle" font-size="10.5" fill="#666">2001:db8:1:2::20</text>
  </g>
  <text x="750" y="415" text-anchor="middle" font-size="12" fill="#a33">Brak NAT to NIE jest zapora: bez filtra hosty są widoczne bezpośrednio.</text>
  <text x="750" y="434" text-anchor="middle" font-size="12" fill="#555">Skanowanie w ciemno /64 jest niewykonalne (2^64 adresów),</text>
  <text x="750" y="451" text-anchor="middle" font-size="12" fill="#555">ale DNS, logi CT i wzorcowe adresy zdradzają cele (RFC 7707).</text>
  <text x="750" y="475" text-anchor="middle" font-size="11.5" fill="#888">Badanie PAM 2021: część routerów domowych nie ma zapory IPv6 domyślnie</text>
</svg>
