<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif" font-size="14">
  <title>IPv4 za NAT wobec IPv6 z zaporą na routerze</title>
  <desc>Dwa panele: IPv4 - jeden publiczny adres i NAT ukrywajacy LAN; IPv6 - każde urządzenie ma adres globalny, o widoczności decyduje firewall routera.</desc>
  <!-- left panel: IPv4 + NAT -->
  <text x="190" y="30" fill="#9a9a9a" text-anchor="middle" font-size="16" font-weight="bold">IPv4: NAT na routerze</text>
  <ellipse cx="190" cy="80" rx="70" ry="28" fill="none" stroke="#4f8ef7" stroke-width="2.5"/>
  <text x="190" y="85" fill="#9a9a9a" text-anchor="middle">Internet</text>
  <line x1="190" y1="108" x2="190" y2="160" stroke="#9a9a9a" stroke-width="2"/>
  <rect x="110" y="160" width="160" height="58" rx="8" fill="none" stroke="#f0ad4e" stroke-width="2.5"/>
  <text x="190" y="184" fill="#9a9a9a" text-anchor="middle">Router z NAT</text>
  <text x="190" y="203" fill="#9a9a9a" text-anchor="middle" font-size="12">1 publiczny IPv4: 203.0.113.7</text>
  <text x="190" y="140" fill="#9a9a9a" text-anchor="middle" font-size="12">połączenia wychodzące</text>
  <line x1="190" y1="218" x2="190" y2="262" stroke="#9a9a9a" stroke-width="2"/>
  <g fill="none" stroke="#5cb85c" stroke-width="2.5">
    <rect x="70"  y="262" width="80" height="34" rx="6"/>
    <rect x="150" y="262" width="80" height="34" rx="6"/>
    <rect x="230" y="262" width="80" height="34" rx="6"/>
  </g>
  <g fill="#9a9a9a" text-anchor="middle" font-size="12">
    <text x="110" y="283">192.0.2.10</text>
    <text x="190" y="283">192.0.2.11</text>
    <text x="270" y="283">192.0.2.12</text>
  </g>
  <text x="190" y="330" fill="#9a9a9a" text-anchor="middle">adresy prywatne: nieosiągalne</text>
  <text x="190" y="348" fill="#9a9a9a" text-anchor="middle">z internetu (ukrywa NAT)</text>
  <text x="190" y="382" fill="#9a9a9a" text-anchor="middle" font-size="12">adresy przykładowe (dokumentacyjne)</text>
  <!-- divider -->
  <line x1="390" y1="40" x2="390" y2="360" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- right panel: IPv6 -->
  <text x="590" y="30" fill="#9a9a9a" text-anchor="middle" font-size="16" font-weight="bold">IPv6: firewall na routerze</text>
  <ellipse cx="590" cy="80" rx="70" ry="28" fill="none" stroke="#4f8ef7" stroke-width="2.5"/>
  <text x="590" y="85" fill="#9a9a9a" text-anchor="middle">Internet</text>
  <line x1="590" y1="108" x2="590" y2="160" stroke="#9a9a9a" stroke-width="2"/>
  <rect x="510" y="160" width="160" height="58" rx="8" fill="none" stroke="#d9534f" stroke-width="2.5"/>
  <text x="590" y="181" fill="#9a9a9a" text-anchor="middle">Router: zapora IPv6</text>
  <text x="590" y="199" fill="#9a9a9a" text-anchor="middle" font-size="12">domyślnie blokuje ruch</text>
  <text x="590" y="213" fill="#9a9a9a" text-anchor="middle" font-size="12">niesprowokowany (RFC 6092)</text>
  <line x1="590" y1="218" x2="590" y2="262" stroke="#9a9a9a" stroke-width="2"/>
  <g fill="none" stroke="#5cb85c" stroke-width="2.5">
    <rect x="470" y="262" width="80" height="34" rx="6"/>
    <rect x="550" y="262" width="80" height="34" rx="6"/>
    <rect x="630" y="262" width="80" height="34" rx="6"/>
  </g>
  <g fill="#9a9a9a" text-anchor="middle" font-size="11">
    <text x="510" y="283">2001:db8:1:2::10</text>
    <text x="590" y="283">2001:db8:1:2::11</text>
    <text x="670" y="283">2001:db8:1:2::12</text>
  </g>
  <text x="590" y="330" fill="#9a9a9a" text-anchor="middle">kazde urzadzenie ma własny</text>
  <text x="590" y="348" fill="#9a9a9a" text-anchor="middle">adres globalny - brak NAT</text>
  <text x="590" y="382" fill="#9a9a9a" text-anchor="middle" font-size="12">adresy przykładowe (dokumentacyjne)</text>
</svg>
